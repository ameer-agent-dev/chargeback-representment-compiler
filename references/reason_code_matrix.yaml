# Reason Code Evidence Matrix (Visa, Mastercard, Amex)
# Used by scripts/triage_and_ce3.py and Step 3 gap checks.

reason_codes:
  visa_10_4:
    network: Visa
    code: "10.4"
    category: "Other Fraud - Card-Absent Environment"
    physical_mandatory:
      - avs_cvv_match
      - delivery_proof
      - order_confirmation
    physical_recommended:
      - ce3_prior_orders
      - ip_device_log
      - customer_communication
    digital_mandatory:
      - login_timestamps
      - ip_geolocation_match
      - feature_usage_logs
      - clickwrap_tos_acceptance
    digital_recommended:
      - ce3_prior_orders
      - avs_cvv_match
      - customer_communication
    ce3_eligible: true

  visa_13_1:
    network: Visa
    code: "13.1"
    category: "Merchandise / Services Not Received"
    physical_mandatory:
