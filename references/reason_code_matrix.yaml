      - ip_geolocation_match
      - feature_usage_logs
      - access_delivery_log
    digital_recommended:
      - clickwrap_tos_acceptance
      - customer_communication
    ce3_eligible: false

  visa_13_3:
    network: Visa
    code: "13.3"
    category: "Not as Described or Defective Merchandise / Services"
    physical_mandatory:
      - product_description_listing
      - order_confirmation
      - refund_return_policy
    physical_recommended:
      - customer_communication
      - delivery_confirmation
      - quality_inspection_record
    digital_mandatory:
      - product_description_listing
      - feature_usage_logs
      - clickwrap_tos_acceptance
      - refund_return_policy
    digital_recommended:
      - customer_communication
      - login_timestamps
    ce3_eligible: false

  visa_13_2:
    network: Visa
    code: "13.2"
    category: "Cancelled Recurring Transaction"
    physical_mandatory:
      - recurring_billing_agreement
      - cancellation_policy_disclosure
      - no_prior_cancellation_log
